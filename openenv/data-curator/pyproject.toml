[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-alignment-data-curator"
version = "1.0.0"
description = "An AI alignment environment for dataset curation, PII scrubbing, and bias filtering."
authors = [
    { name = "Bhargav-P-Y" }
]
dependencies = [
    "openenv-core>=0.2.2",
    "fastapi",
    "uvicorn",
    "pydantic",
    "autopep8>=2.0.0"
]
requires-python = ">=3.11"

[project.scripts]
server = "server.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["server*", "models*"]
